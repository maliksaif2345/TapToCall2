name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write full project (single-file setup)
        run: |
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'TCEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          TCEOF
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'TCEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TapToCall"
          include ':app'
          TCEOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'TCEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          TCEOF
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'TCEOF'
          plugins { id 'com.android.application' }

          def ksFile = System.getenv('KEYSTORE_FILE')

          android {
              namespace 'com.tapcall'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tapcall.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              if (ksFile) {
                  signingConfigs {
                      release {
                          storeFile file(ksFile)
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEY_PASSWORD')
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      if (ksFile) signingConfig signingConfigs.release
                  }
              }
          }
          TCEOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'TCEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-feature android:name="android.hardware.telephony" android:required="false"/>
              <application
                  android:label="Tap To Call"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          TCEOF
          mkdir -p "$(dirname app/src/main/java/com/tapcall/MainActivity.java)"
          cat > app/src/main/java/com/tapcall/MainActivity.java <<'TCEOF'
          package com.tapcall;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.InputType;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.security.SecureRandom;

          public class MainActivity extends Activity {
              static final int REQ_PICK = 1, REQ_CALL = 2;
              static final int SLOTS = 4;
              static final int MIN_PW = 4;

              JSONObject[] slots = new JSONObject[SLOTS];
              LinearLayout list;
              TextView empty;
              Button editBtn, pwBtn;
              boolean edit = false;
              boolean sessionUnlocked = false;
              String pendingCall;
              Bitmap pickedBmp;
              TextView photoLabel;
              SharedPreferences sp;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("tc", MODE_PRIVATE);
                  loadSlots();

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#F4F1EA"));
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(24), dp(16), dp(32));
                  sv.addView(root);

                  TextView title = new TextView(this);
                  title.setText("Tap a photo to call");
                  title.setTextSize(24);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setTextColor(Color.parseColor("#1D2A2A"));
                  title.setPadding(0, 0, 0, dp(16));
                  root.addView(title);

                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  root.addView(list);

                  empty = new TextView(this);
                  empty.setText("No contacts yet.\nTap Edit to add up to 4 contacts.");
                  empty.setTextSize(18);
                  empty.setGravity(Gravity.CENTER);
                  empty.setPadding(0, dp(24), 0, dp(24));
                  root.addView(empty);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER);
                  editBtn = new Button(this);
                  editBtn.setText("Edit");
                  editBtn.setAllCaps(false);
                  editBtn.setOnClickListener(v -> {
                      if (edit) {
                          setEdit(false);
                      } else if (isLocked()) {
                          requireAuth(() -> setEdit(true));
                      } else {
                          setEdit(true);
                      }
                  });
                  pwBtn = new Button(this);
                  pwBtn.setText("Change password");
                  pwBtn.setAllCaps(false);
                  pwBtn.setVisibility(View.GONE);
                  pwBtn.setOnClickListener(v -> requireAuth(() -> showSetPasswordDialog(true)));
                  bar.addView(editBtn);
                  bar.addView(pwBtn);
                  root.addView(bar);

                  setContentView(sv);
                  render();

                  if (!sp.contains("ph")) showSetPasswordDialog(false);
              }

              // ---------- storage ----------

              void loadSlots() {
                  try {
                      JSONArray a = new JSONArray(sp.getString("c", "[]"));
                      for (int i = 0; i < SLOTS; i++) slots[i] = i < a.length() ? a.optJSONObject(i) : null;
                  } catch (Exception e) {
                      for (int i = 0; i < SLOTS; i++) slots[i] = null;
                  }
              }

              void persist() {
                  JSONArray a = new JSONArray();
                  for (int i = 0; i < SLOTS; i++) a.put(slots[i] == null ? JSONObject.NULL : slots[i]);
                  SharedPreferences.Editor ed = sp.edit().putString("c", a.toString());
                  if (allFilled()) ed.putBoolean("locked", true);
                  ed.apply();
              }

              boolean allFilled() {
                  for (JSONObject o : slots) if (o == null) return false;
                  return true;
              }

              // Once all 4 contacts have been entered, editing always needs the password.
              boolean isLocked() { return sp.getBoolean("locked", false) || allFilled(); }

              File photoFile(int i) { return new File(getFilesDir(), "slot" + i + ".jpg"); }

              // ---------- password ----------

              String hash(String salt, String pw) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] d = md.digest((salt + pw).getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte x : d) sb.append(String.format("%02x", x));
                      return sb.toString();
                  } catch (Exception e) { throw new RuntimeException(e); }
              }

              void savePassword(String pw) {
                  byte[] s = new byte[16];
                  new SecureRandom().nextBytes(s);
                  String salt = Base64.encodeToString(s, Base64.NO_WRAP);
                  sp.edit().putString("salt", salt).putString("ph", hash(salt, pw)).apply();
              }

              boolean checkPassword(String pw) {
                  String salt = sp.getString("salt", "");
                  String ph = sp.getString("ph", "");
                  return MessageDigest.isEqual(hash(salt, pw).getBytes(StandardCharsets.UTF_8),
                          ph.getBytes(StandardCharsets.UTF_8));
              }

              EditText pwField(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  return e;
              }

              void showSetPasswordDialog(final boolean changing) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(12), dp(20), 0);
                  final EditText p1 = pwField("Password (min " + MIN_PW + " characters)");
                  final EditText p2 = pwField("Repeat password");
                  box.addView(p1);
                  box.addView(p2);

                  AlertDialog.Builder bd = new AlertDialog.Builder(this)
                      .setTitle(changing ? "Change password" : "Set a password")
                      .setMessage(changing ? null : "This password will be needed to edit contacts after all 4 are saved.")
                      .setView(box)
                      .setPositiveButton("Save", null);
                  if (changing) bd.setNegativeButton("Cancel", null);
                  else bd.setCancelable(false);
                  final AlertDialog dlg = bd.create();
                  dlg.show();
                  dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                      String a = p1.getText().toString();
                      String c = p2.getText().toString();
                      if (a.length() < MIN_PW) {
                          Toast.makeText(this, "Use at least " + MIN_PW + " characters", Toast.LENGTH_LONG).show();
                      } else if (!a.equals(c)) {
                          Toast.makeText(this, "Passwords do not match", Toast.LENGTH_LONG).show();
                      } else {
                          savePassword(a);
                          Toast.makeText(this, "Password saved", Toast.LENGTH_SHORT).show();
                          dlg.dismiss();
                      }
                  });
              }

              void askPassword(final Runnable onOk) {
                  final EditText pw = pwField("Password");
                  LinearLayout box = new LinearLayout(this);
                  box.setPadding(dp(20), dp(12), dp(20), 0);
                  box.addView(pw, new LinearLayout.LayoutParams(-1, -2));
                  final AlertDialog dlg = new AlertDialog.Builder(this)
                      .setTitle("Enter password")
                      .setView(box)
                      .setPositiveButton("OK", null)
                      .setNegativeButton("Cancel", null)
                      .create();
                  dlg.show();
                  dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                      if (checkPassword(pw.getText().toString())) {
                          dlg.dismiss();
                          onOk.run();
                      } else {
                          pw.setText("");
                          Toast.makeText(this, "Wrong password", Toast.LENGTH_LONG).show();
                      }
                  });
              }

              // ---------- UI ----------

              // Password is needed for any edit of a saved contact. Calling never needs it.
              void requireAuth(final Runnable onOk) {
                  if (sessionUnlocked) { onOk.run(); return; }
                  askPassword(() -> { sessionUnlocked = true; onOk.run(); });
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (edit) setEdit(false);
              }

              void setEdit(boolean on) {
                  edit = on;
                  if (!on) sessionUnlocked = false;
                  editBtn.setText(on ? "Done" : "Edit");
                  pwBtn.setVisibility(on ? View.VISIBLE : View.GONE);
                  render();
              }

              void render() {
                  list.removeAllViews();
                  boolean any = false;
                  int w = getResources().getDisplayMetrics().widthPixels - dp(32);
                  for (int i = 0; i < SLOTS; i++) {
                      final JSONObject o = slots[i];
                      final int idx = i;
                      if (o == null && !edit) continue;
                      any = true;

                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(Color.WHITE);
                      bg.setCornerRadius(dp(24));
                      card.setBackground(bg);
                      card.setClipToOutline(true);
                      card.setElevation(dp(4));
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1, -2);
                      cp.bottomMargin = dp(16);
                      card.setLayoutParams(cp);

                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setBackgroundColor(Color.parseColor("#CFD8D6"));
                      File f = photoFile(i);
                      if (o != null && f.exists()) iv.setImageBitmap(BitmapFactory.decodeFile(f.getAbsolutePath()));
                      card.addView(iv, new LinearLayout.LayoutParams(w, w));

                      TextView name = new TextView(this);
                      String label;
                      int color;
                      if (o == null) {
                          label = "+  Add contact " + (i + 1);
                          color = Color.parseColor("#5B6B6A");
                      } else if (edit) {
                          label = "Tap to edit: " + o.optString("name");
                          color = Color.parseColor("#C0392B");
                      } else {
                          label = "\uD83D\uDCDE  " + o.optString("name");
                          color = Color.parseColor("#1F9D55");
                      }
                      name.setText(label);
                      name.setTextSize(28);
                      name.setTypeface(null, Typeface.BOLD);
                      name.setGravity(Gravity.CENTER);
                      name.setTextColor(Color.WHITE);
                      name.setBackgroundColor(color);
                      name.setPadding(dp(8), dp(18), dp(8), dp(18));
                      card.addView(name, new LinearLayout.LayoutParams(-1, -2));

                      card.setOnClickListener(v -> {
                          if (edit) {
                              if (o != null) requireAuth(() -> showSlotDialog(idx));
                              else showSlotDialog(idx);
                          } else if (o != null) {
                              call(o.optString("num"));
                          }
                      });
                      list.addView(card);
                  }
                  empty.setVisibility(any ? View.GONE : View.VISIBLE);
              }

              // ---------- calling ----------

              void call(String raw) {
                  String n = raw.replaceAll("[^0-9+]", "");
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
                      pendingCall = n;
                      requestPermissions(new String[]{Manifest.permission.CALL_PHONE}, REQ_CALL);
                      return;
                  }
                  startActivity(new Intent(Intent.ACTION_CALL, Uri.fromParts("tel", n, null)));
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == REQ_CALL && pendingCall != null) {
                      String n = pendingCall;
                      pendingCall = null;
                      boolean ok = res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED;
                      startActivity(new Intent(ok ? Intent.ACTION_CALL : Intent.ACTION_DIAL, Uri.fromParts("tel", n, null)));
                  }
              }

              // ---------- add / edit a slot ----------

              void showSlotDialog(final int idx) {
                  pickedBmp = null;
                  final JSONObject cur = slots[idx];
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(12), dp(20), 0);
                  final EditText nm = new EditText(this);
                  nm.setHint("Name (e.g. Son)");
                  final EditText num = new EditText(this);
                  num.setHint("Number, e.g. +966501234567");
                  num.setInputType(InputType.TYPE_CLASS_PHONE);
                  if (cur != null) {
                      nm.setText(cur.optString("name"));
                      num.setText(cur.optString("num"));
                  }
                  Button pick = new Button(this);
                  pick.setText(cur != null && photoFile(idx).exists() ? "Change photo" : "Choose photo");
                  pick.setAllCaps(false);
                  photoLabel = new TextView(this);
                  photoLabel.setText(cur != null && photoFile(idx).exists() ? "Current photo kept" : "No photo selected");
                  pick.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(i, REQ_PICK);
                  });
                  box.addView(nm);
                  box.addView(num);
                  box.addView(pick);
                  box.addView(photoLabel);

                  AlertDialog.Builder bd = new AlertDialog.Builder(this)
                      .setTitle(cur == null ? "Contact " + (idx + 1) : "Edit contact " + (idx + 1))
                      .setView(box)
                      .setPositiveButton("Save", null)
                      .setNegativeButton("Cancel", null);
                  if (cur != null) bd.setNeutralButton("Delete", null);
                  final AlertDialog dlg = bd.create();
                  dlg.show();

                  dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                      String name = nm.getText().toString().trim();
                      String number = num.getText().toString().trim();
                      if (name.isEmpty() || number.isEmpty()) {
                          Toast.makeText(this, "Name and number are required", Toast.LENGTH_LONG).show();
                          return;
                      }
                      try {
                          JSONObject o = new JSONObject();
                          o.put("name", name);
                          o.put("num", number);
                          if (pickedBmp != null) {
                              FileOutputStream fo = new FileOutputStream(photoFile(idx));
                              pickedBmp.compress(Bitmap.CompressFormat.JPEG, 85, fo);
                              fo.close();
                          }
                          slots[idx] = o;
                          persist();
                          render();
                          dlg.dismiss();
                          if (isLocked() && allFilled()) {
                              Toast.makeText(this, "All 4 contacts saved. Editing now needs your password.", Toast.LENGTH_LONG).show();
                              setEdit(false);
                          }
                      } catch (Exception e) {
                          Toast.makeText(this, "Could not save", Toast.LENGTH_LONG).show();
                      }
                  });

                  if (cur != null) {
                      dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(v ->
                          new AlertDialog.Builder(this)
                              .setMessage("Delete " + cur.optString("name") + "?")
                              .setPositiveButton("Delete", (d, x) -> {
                                  photoFile(idx).delete();
                                  slots[idx] = null;
                                  persist();
                                  render();
                                  dlg.dismiss();
                              })
                              .setNegativeButton("Cancel", null)
                              .show());
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_PICK || res != RESULT_OK || data == null || data.getData() == null) return;
                  try {
                      Uri u = data.getData();
                      BitmapFactory.Options bo = new BitmapFactory.Options();
                      bo.inJustDecodeBounds = true;
                      InputStream a = getContentResolver().openInputStream(u);
                      BitmapFactory.decodeStream(a, null, bo);
                      a.close();
                      int s = 1;
                      while (bo.outWidth / (s * 2) >= 800 && bo.outHeight / (s * 2) >= 800) s *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = s;
                      InputStream b2 = getContentResolver().openInputStream(u);
                      Bitmap src = BitmapFactory.decodeStream(b2, null, o2);
                      b2.close();
                      int m = Math.min(src.getWidth(), src.getHeight());
                      Bitmap sq = Bitmap.createBitmap(src, (src.getWidth() - m) / 2, (src.getHeight() - m) / 2, m, m);
                      pickedBmp = Bitmap.createScaledBitmap(sq, 600, 600, true);
                      if (photoLabel != null) photoLabel.setText("New photo selected");
                  } catch (Exception e) {
                      Toast.makeText(this, "Could not load photo", Toast.LENGTH_LONG).show();
                  }
              }
          }
          TCEOF
          mkdir -p "$(dirname app/src/main/res/drawable/ic_launcher.xml)"
          cat > app/src/main/res/drawable/ic_launcher.xml <<'TCEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1F9D55" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M42,32c-1.5,0 -2.8,0.8 -3.4,2.2l-2.2,5.2c-0.6,1.4 -0.4,3 0.5,4.2c3.6,5.3 8.2,9.9 13.5,13.5c1.2,0.9 2.8,1.1 4.2,0.5l5.2,-2.2c1.4,-0.6 2.2,-1.9 2.2,-3.4v-5.2c0,-1.1 -0.8,-2.1 -1.9,-2.4l-5.6,-1.4c-0.9,-0.2 -1.8,0.1 -2.4,0.8l-1.6,1.9c-3,-1.8 -5.5,-4.3 -7.3,-7.3l1.9,-1.6c0.7,-0.6 1,-1.5 0.8,-2.4l-1.4,-5.6c-0.3,-1.1 -1.3,-1.9 -2.4,-1.9z"/>
          </vector>
          TCEOF

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Decode keystore (if provided)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK (if keystore provided)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TapToCall-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
